name: Build & Deploy

on:
  push:
    branches: [main]
  schedule:
    # 毎日 JST 6:00（UTC 21:00）に jGrants から最新データを取り直して再公開
    - cron: "0 21 * * *"
    # 自治体サイトの巡回は負荷が大きいので週1回（日曜 JST 5:00）
    - cron: "0 20 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build deps (OGP画像の生成に使用)
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk

      - name: Refresh data from jGrants (scheduled / manual only)
        if: github.event_name != 'push'
        run: python fetch.py

      - name: Refresh municipal data (weekly)
        if: github.event.schedule == '0 20 * * 0' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          MUNI_MAX_PAGES: "240"
          MUNI_MAX_DEPTH: "3"
          MUNI_DELAY: "0.8"
          MUNI_WORKERS: "4"
        run: python municipal.py

      - name: Deadline alert digest (scheduled / manual only)
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_TO:   ${{ vars.ALERT_TO }}
          ALERT_FROM: ${{ vars.ALERT_FROM }}
          KH_BASE:     ${{ vars.KH_BASE }}
          KH_BASE_URL: ${{ vars.KH_BASE_URL }}
        run: python alert.py

      - name: Commit refreshed data
        if: github.event_name != 'push'
        continue-on-error: true
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --staged --quiet || git commit -m "chore: refresh jGrants data ($(date -u +%Y-%m-%d))"
          git push

      - name: Build site
        env:
          KH_BASE: ${{ vars.KH_BASE }}
          KH_BASE_URL: ${{ vars.KH_BASE_URL }}
        run: python build.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
